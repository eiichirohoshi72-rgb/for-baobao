<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mysterious Love Box</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: "Poppins", sans-serif; }
    body { background: #f3efe9; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    .container { text-align: center; max-width: 640px; padding: 22px; }
    h1 { font-size: 28px; margin-bottom: 14px; color: #402c1d; font-weight: 600; }
    p.desc { font-size: 17px; color: #574533; margin-bottom: 20px; }

    .hearts { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px; margin: 22px 0 24px; }
    .heart-btn { width: 68px; height: 68px; background: linear-gradient(180deg,#ff6b81,#ff4b6b); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 26px; color: white; cursor: pointer; transition: transform .22s, box-shadow .22s; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
    .heart-btn:active{ transform: scale(0.94); }
    .heart-btn.collected { background: linear-gradient(180deg,#d1c9c4,#b6b0ad); color:#fff; cursor: default; transform: scale(0.86); box-shadow: none; }

    #unlockBtn { opacity: 0; pointer-events: none; margin-top: 12px; padding: 12px 26px; font-size: 17px; background: #1f9d55; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: .32s; box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
    #unlockBtn.show { opacity: 1; pointer-events: all; transform: translateY(0); }

    /* BOX SCENE */
    #boxScene { opacity: 0; pointer-events: none; position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.65); transition: opacity .45s ease, visibility .45s; }
    #boxScene.active { opacity: 1; pointer-events: all; }

    .box-wrap { position: relative; width: 460px; max-width: 92vw; display: flex; gap: 18px; align-items: center; }
    .box { width: 320px; height: 220px; background: #8b5a3c; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.45); position: relative; animation: pop .5s cubic-bezier(.2,.9,.3,1); }
    .box:before { content: ""; position: absolute; width: 100%; height: 60px; background: #70452c; top: 0; border-top-left-radius: 14px; border-top-right-radius: 14px; }
    @keyframes pop { 0% { transform: scale(.78); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

    /* small instruction / tappable letter label */
    #letterInside { opacity: 0; transform: translateY(8px); transition: .5s ease; color: #fff; font-size: 18px; margin-left: 8px; cursor: default; }
    #letterInside.show { opacity: 1; transform: translateY(0); }

    /* Letter panel (hidden until tapped) */
    .letterPanel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.65); visibility: hidden; opacity: 0; transition: opacity .4s ease, visibility .4s; }
    .letterPanel.open { visibility: visible; opacity: 1; }
    .paper { width: min(780px,92vw); max-width: 820px; background: linear-gradient(180deg,#fffefb,#f4eee4); border-radius: 8px; padding: 28px 36px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); transform: translateY(20px); opacity: 0; transition: transform .6s cubic-bezier(.2,.9,.3,1), opacity .6s; }
    .paper.show { transform: translateY(0); opacity: 1; }
    .paper h2 { font-family: 'Poppins', sans-serif; font-size: 22px; color: #6c4333; margin-bottom: 12px; }
    .paper .body { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; color: #3e2b25; line-height: 1.9; white-space: pre-wrap; }

    .closeBtn { margin-top: 18px; display:inline-block; padding: 10px 16px; border-radius: 8px; background: #ffd1e8; color: #3b2a25; font-weight:600; cursor:pointer; }

    .sakura { width: 160px; height: 160px; transform: rotate(-14deg); opacity: .0; transition: all .6s ease; }
    .sakura.show { opacity: 1; transform: rotate(-8deg) translateY(-6px); }

    @media (max-width:720px){ .paper { padding: 18px; font-size: 16px } .sakura{ display:none } }
  </style>
</head>
<body>
  <div class="container">
    <h1>You found a mysterious box... full of love</h1>
    <p class="desc">But it's locked. Collect all the hearts to unlock the key.</p>

    <div class="hearts" id="heartsArea"></div>

    <button id="unlockBtn">Unlock the Box</button>
  </div>

  <!-- Box scene contains box + tappable label that opens actual letter -->
  <div id="boxScene" aria-hidden="true">
    <div class="box-wrap">
      <div class="box" id="boxObject" aria-hidden="true" role="img" aria-label="A locked wooden box filled with tiny hearts"></div>
      <div id="letterInside">💌 The letter is now unlocked — tap here to open it.</div>
      <!-- small sakura svg beside box -->
      <svg class="sakura" id="sakuraSVG" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#6b3a2a" stroke-width="3"><path d="M12 150 C40 120, 90 100, 160 80" stroke-linecap="round"/></g>
        <g id="blossoms" fill="#ffd1e8" stroke="#ff7aa6" stroke-width="0.8"><circle cx="120" cy="60" r="10"/><circle cx="140" cy="78" r="8"/><circle cx="100" cy="86" r="7"/><circle cx="72" cy="110" r="6"/><circle cx="150" cy="110" r="5"/></g>
      </svg>
    </div>
  </div>

  <!-- Letter panel (final) -->
  <div class="letterPanel" id="letterPanel" aria-modal="true" role="dialog">
    <div class="paper" id="paper">
      <h2 id="paperTitle">To Baobao,</h2>
      <div class="body" id="paperBody">(Your letter will appear here)</div>
      <div style="text-align:center"><button class="closeBtn" id="closeLetter">Close</button></div>
    </div>
  </div>

  <script>
    // simple config — change text here
    const CONFIG = {
      letterText: `Dear Baobao,

Happy birthday, my love. Even though miles and screens stand between us, you have become the most real part of my life. I used to think love needed presence, touch, or shared places—but you proved that hearts don’t follow the rules of distance.

Thank you for staying, for choosing me even when the world gave us every reason to give up. Thank you for the nights we held on through voice calls, blurry signals, sleepy eyes, and the kind of laughter that makes distance feel small. You are softness in a world that is loud, a quiet peace in my chest when everything else is heavy.

One day, I will look into your eyes without a screen in the way. I will hold the hands that have been holding mine from afar. I don’t know the exact day, but I know that when it comes, it will be worth every second of waiting.

Until then, I will keep choosing you—on the happy days, on the hard days, and on all the ordinary days in between.

No distance, no timezone, no silence can change the way my heart stays yours.

Forever your Kagami`
    }

    // hearts
    const heartCount = 6;
    const heartsArea = document.getElementById('heartsArea');
    const unlockBtn = document.getElementById('unlockBtn');
    const boxScene = document.getElementById('boxScene');
    const letterInside = document.getElementById('letterInside');
    const sakuraSVG = document.getElementById('sakuraSVG');
    const letterPanel = document.getElementById('letterPanel');
    const paper = document.getElementById('paper');
    const paperBody = document.getElementById('paperBody');
    const closeLetter = document.getElementById('closeLetter');

    let collected = 0;

    // create hearts
    for (let i = 0; i < heartCount; i++) {
      const btn = document.createElement('div');
      btn.className = 'heart-btn';
      btn.innerHTML = '❤';
      btn.tabIndex = 0;
      btn.setAttribute('role','button');
      btn.setAttribute('aria-label', `Collect heart ${i+1}`);

      btn.addEventListener('click', () => collectHeart(btn));
      btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') collectHeart(btn); });

      heartsArea.appendChild(btn);
    }

    function collectHeart(btn){
      if (btn.classList.contains('collected')) return;
      btn.classList.add('collected');
      collected++;
      // little pop animation
      btn.animate([{ transform: 'scale(0.88)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' });
      if (collected === heartCount) showUnlock();
    }

    function showUnlock(){ unlockBtn.classList.add('show'); unlockBtn.focus(); }

    // unlocking the box reveals the boxScene and shows tappable label
    unlockBtn.addEventListener('click', () => {
      boxScene.classList.add('active');
      boxScene.setAttribute('aria-hidden', 'false');
      // show the letterInside label after a small delay
      setTimeout(() => {
        letterInside.classList.add('show');
        sakuraSVG.classList.add('show');
      }, 420);
    });

    // === FIX: make the letter tappable to open ===
    // previously letterInside had no click handler — now it does.
    letterInside.style.cursor = 'pointer';
    letterInside.setAttribute('role', 'button');
    letterInside.tabIndex = 0;

    letterInside.addEventListener('click', openLetterPanel);
    letterInside.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') openLetterPanel(); });

    function openLetterPanel(){
      // guard: only open if unlocked (boxScene active and label shown)
      if (!boxScene.classList.contains('active') || !letterInside.classList.contains('show')) return;

      // fill the letter body with the configured text
      paperBody.innerText = CONFIG.letterText;

      // show panel and animate
      letterPanel.classList.add('open');
      setTimeout(() => paper.classList.add('show'), 60);

      // small additional visual: animate the box lid slightly (if present) and confetti
      spawnConfettiBig();
    }

    closeLetter.addEventListener('click', closePanel);
    closeLetter.addEventListener('keydown', (e)=>{ if (e.key==='Enter' || e.key===' ') closePanel(); });

    function closePanel(){ paper.classList.remove('show'); setTimeout(()=> letterPanel.classList.remove('open'), 360); }

    // simple confetti using DOM canvas for effect when opening letter
    const confCanvas = document.createElement('canvas');
    confCanvas.style.position = 'fixed'; confCanvas.style.left = '0'; confCanvas.style.top = '0'; confCanvas.style.pointerEvents = 'none';
    confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight; document.body.appendChild(confCanvas);
    const confCtx = confCanvas.getContext('2d'); let confParts = [];
    window.addEventListener('resize', ()=>{ confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight; });

    function spawnConfettiBig(){ for(let i=0;i<80;i++){ confParts.push({ x: Math.random()*confCanvas.width, y: -20 - Math.random()*200, vx: (Math.random()-0.5)*4, vy: 1+Math.random()*3, size: 6+Math.random()*10, col: ['#ff6b81','#ffb6c1','#ffd9e0','#ffe7f0'][Math.floor(Math.random()*4)], rot: Math.random()*Math.PI*2, life: 120+Math.floor(Math.random()*60) }); } if (!confAnimating) { confAnimating = true; requestAnimationFrame(confUpdate); } }

    let confAnimating=false;
    function confUpdate(){ confCtx.clearRect(0,0,confCanvas.width,confCanvas.height); for(let i=confParts.length-1;i>=0;i--){ const p = confParts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.rot += 0.06; confCtx.save(); confCtx.translate(p.x,p.y); confCtx.rotate(p.rot); confCtx.fillStyle = p.col; confCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); confCtx.restore(); p.life--; if (p.life<=0 || p.y>confCanvas.height+40) confParts.splice(i,1); } if (confParts.length>0) requestAnimationFrame(confUpdate); else confAnimating=false; }

    // accessibility: close panel with ESC
    window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape'){ if (letterPanel.classList.contains('open')) closePanel(); else if (boxScene.classList.contains('active')) { boxScene.classList.remove('active'); letterInside.classList.remove('show'); sakuraSVG.classList.remove('show'); } } });

  </script>
</body>
</html>
